<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tracking Link Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 font-sans">
    <main class="container mx-auto p-6">
      <h1 class="text-3xl font-bold mb-6">Instagram Link Tracker</h1>
      <form id="trackingForm" class="bg-white p-6 rounded shadow-md space-y-4">
        <div>
          <label class="block mb-1 font-medium">Instagram URL</label>
          <input
            type="url"
            id="url"
            class="w-full border p-2 rounded"
            placeholder="https://instagram.com/akunmu"
            required
          />
        </div>
        <div>
          <label class="block mb-1 font-medium">Description</label>
          <input
            type="text"
            id="description"
            class="w-full border p-2 rounded"
            placeholder="Link untuk siapa?"
            required
          />
        </div>
        <button
          type="submit"
          class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700"
        >
          Generate Link
        </button>
      </form>
      <div id="linksList" class="mt-6 space-y-4"></div>
      <div id="clicksContainer" class="hidden mt-8"></div>
    </main>

    <script>
      const backendBaseURL = "tracking-link-project.vercel.app";

 // ✅ Ganti dengan URL backend kamu

      document
        .getElementById("trackingForm")
        .addEventListener("submit", function (event) {
          event.preventDefault(); // ✅ cegah reload

          const url = document.getElementById("url").value;
          const description = document.getElementById("description").value;

          // 🔻 Kirim ke backend
          fetch(`${backendBaseURL}/api/generate`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url, description }),
          })
            .then((res) => res.json())
            .then((data) => {
              if (data && data.trackingUrl) {
                const linkId = data.trackingUrl.split("/").pop();
                const div = document.createElement("div");
                div.classList.add("bg-white", "p-4", "rounded", "shadow-md");
                div.innerHTML = `
                <p class="font-bold">${description}</p>
                <a href="${data.trackingUrl}" class="text-blue-600 underline" target="_blank">${data.trackingUrl}</a>
                <div id="clicks-${linkId}" class="mt-4 text-sm text-gray-700">
                    <p>Loading clicks...</p>
                </div>
            `;
                document.getElementById("linksList").appendChild(div);

                // Fetch data klik setelah tampil
                fetch(`${backendBaseURL}/api/clicks/${linkId}`)
                  .then((res) => res.json())
                  .then((clicks) => {
                    const clicksContainer = document.getElementById(
                      `clicks-${linkId}`
                    );
                    if (clicks && clicks.length === 0) {
                      clicksContainer.innerHTML = `<p class="text-gray-500 italic">Belum ada klik</p>`;
                    } else {
                      clicksContainer.innerHTML = `
                        <p class="font-semibold mb-1">📍 Lokasi Klik:</p>
                        ${clicks
                          .map(
                            (c) => `
                            <div class="mb-1">- ${c.city}, ${c.region}, ${
                              c.country
                            } — ${new Date(c.time).toLocaleString()}</div>
                        `
                          )
                          .join("")}
                    `;
                    }
                  })
                  .catch((error) => {
                    const clicksContainer = document.getElementById(
                      `clicks-${linkId}`
                    );
                    clicksContainer.innerHTML = `<p class="text-red-500">Gagal memuat data klik.</p>`;
                    console.error("Error fetching clicks:", error);
                  });
              } else {
                alert("URL tracking gagal dibuat!");
              }
            })
            .catch((error) => {
              console.error("Error generating tracking URL:", error);
              alert("Terjadi kesalahan saat membuat tracking URL.");
            });
        });
    </script>
    <script>
      function renderClicks(clicks) {
        const clicksContainer = document.getElementById("clicksContainer");
        clicksContainer.classList.remove("hidden");
        clicksContainer.innerHTML = `
    <p class="font-semibold mb-2">📍 Lokasi Klik:</p>
    ${clicks
      .map((c) => {
        const [lat, lon] = c.loc ? c.loc.split(",") : [null, null];
        return `
        <div class="mb-4">
          <div>- ${c.city}, ${c.region}, ${c.country} — ${new Date(
          c.time
        ).toLocaleString()}</div>
          ${
            lat && lon
              ? `
            <iframe
              width="100%"
              height="200"
              class="mt-2 rounded"
              style="border:1px solid #ccc"
              loading="lazy"
              src="https://maps.google.com/maps?q=${lat},${lon}&z=14&output=embed">
            </iframe>
          `
              : '<div class="text-red-500 text-sm mt-1">Lokasi tidak tersedia.</div>'
          }
        </div>
      `;
      })
      .join("")}
  `;
      }
    </script>
  </body>
</html>
